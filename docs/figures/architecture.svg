<svg viewBox="0 0 1500 980" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222222"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b3005c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1500" height="980" fill="#ffffff"/>

  <!-- ============ Section titles ============ -->
  <text x="40" y="42" font-size="30" fill="#8a8a8a">Input</text>
  <text x="1180" y="42" font-size="30" fill="#8a8a8a">Output</text>

  <!-- ============ INPUT: text ============ -->
  <text x="40" y="100" font-size="22" fill="#111111">Text</text>
  <text x="120" y="100" font-size="15" fill="#111111" font-family="Georgia, 'Times New Roman', serif">
    um-ma i-din-{d}suen-ma ... x x pi e taš-hu x im-mar ...
  </text>

  <!-- ============ INPUT: image ============ -->
  <text x="40" y="150" font-size="22" fill="#111111">Image</text>
  <g transform="translate(120,122)">
    <rect x="0" y="0" width="42" height="55" rx="3" fill="#e9e2d3" stroke="#8a7a55" stroke-width="1.5"/>
    <path d="M6,42 L16,26 L24,36 L32,20 L38,42 Z" fill="#c9bb96"/>
    <circle cx="12" cy="12" r="4" fill="#c9bb96"/>
  </g>
  <text x="175" y="153" font-size="13" fill="#777777" font-style="italic">(11.7% of tablets; else all-zero placeholder)</text>

  <!-- ============ Damage-marker + tokenization box ============ -->
  <rect x="40" y="185" width="430" height="46" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="255" y="213" font-size="15" fill="#111111" text-anchor="middle">Damage-marker substitution ( x / ... ) + WordPiece tokenization</text>
  <line x1="140" y1="105" x2="140" y2="185" stroke="#222222" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============ Embedding box ============ -->
  <rect x="40" y="255" width="430" height="46" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="255" y="283" font-size="15" fill="#111111" text-anchor="middle">Token + Position Embeddings</text>
  <line x1="255" y1="231" x2="255" y2="255" stroke="#222222" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============ mBERT encoder loop box ============ -->
  <g>
    <rect x="40" y="330" width="430" height="480" rx="8" fill="#ffffff" stroke="#333333" stroke-width="2"/>
    <text x="58" y="358" font-size="17" fill="#111111" font-weight="bold">mBERT encoder</text>
    <text x="58" y="380" font-size="14" fill="#555555">bert-base-multilingual-cased</text>
    <text x="430" y="358" font-size="20" fill="#111111" text-anchor="end" font-weight="bold">&#215;12</text>

    <line x1="255" y1="301" x2="255" y2="330" stroke="#222222" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- inner stack -->
    <rect x="80" y="400" width="350" height="56" rx="6" fill="#ffffff" stroke="#b3005c" stroke-width="1.5"/>
    <text x="255" y="433" font-size="15" fill="#111111" text-anchor="middle">Multi-head self-attention</text>

    <line x1="255" y1="456" x2="255" y2="480" stroke="#222222" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="80" y="480" width="350" height="46" rx="6" fill="#ffffff" stroke="#b3005c" stroke-width="1.5"/>
    <text x="255" y="508" font-size="15" fill="#111111" text-anchor="middle">Add &amp; normalize</text>

    <line x1="255" y1="526" x2="255" y2="550" stroke="#222222" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="80" y="550" width="350" height="46" rx="6" fill="#ffffff" stroke="#b3005c" stroke-width="1.5"/>
    <text x="255" y="578" font-size="15" fill="#111111" text-anchor="middle">Feed forward</text>

    <line x1="255" y1="596" x2="255" y2="620" stroke="#222222" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="80" y="620" width="350" height="46" rx="6" fill="#ffffff" stroke="#b3005c" stroke-width="1.5"/>
    <text x="255" y="648" font-size="15" fill="#111111" text-anchor="middle">Add &amp; normalize</text>

    <!-- loop-back curve -->
    <path d="M 430 425 C 470 425, 470 660, 430 643" fill="none" stroke="#222222" stroke-width="1.5" marker-end="url(#arrow)"/>

    <text x="255" y="700" font-size="14" fill="#777777" text-anchor="middle" font-style="italic">(12 layers, 768 hidden, 12 heads)</text>

    <line x1="255" y1="666" x2="255" y2="760" stroke="#222222" stroke-width="1.5"/>
    <text x="255" y="742" font-size="15" fill="#111111" text-anchor="middle">Sequence output</text>
    <rect x="130" y="720" width="250" height="42" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
    <text x="255" y="746" font-size="15" fill="#111111" text-anchor="middle">[CLS] representation</text>
  </g>

  <!-- ============ Vision branch ============ -->
  <g>
    <rect x="130" y="830" width="250" height="40" rx="6" fill="#ffffff" stroke="#0a6e6e" stroke-width="1.5"/>
    <text x="255" y="855" font-size="14" fill="#111111" text-anchor="middle">ResNet18 (ImageNet, fine-tuned)</text>
    <line x1="141" y1="177" x2="200" y2="830" stroke="#0a6e6e" stroke-width="1.3" stroke-dasharray="4 3"/>

    <rect x="130" y="890" width="250" height="40" rx="6" fill="#ffffff" stroke="#0a6e6e" stroke-width="1.5"/>
    <text x="255" y="915" font-size="14" fill="#111111" text-anchor="middle">LayerNorm &#8594; image feature</text>
    <line x1="255" y1="870" x2="255" y2="890" stroke="#0a6e6e" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  </g>

  <!-- ============ Heads (Feed Forward x5) ============ -->
  <!-- x positions: encoder right edge ~470, heads column ~560-760, output column ~900-1460 -->

  <!-- Restoration head: reads full sequence, not just CLS -->
  <line x1="470" y1="620" x2="560" y2="410" stroke="#222222" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="560" y="386" width="150" height="46" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="635" y="414" font-size="14" fill="#111111" text-anchor="middle">Feed forward</text>
  <text x="635" y="370" font-size="13" fill="#555555" text-anchor="middle">(all positions)</text>

  <!-- Period head -->
  <line x1="380" y1="741" x2="560" y2="470" stroke="#222222" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="560" y="446" width="150" height="46" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="635" y="474" font-size="14" fill="#111111" text-anchor="middle">Feed forward</text>

  <!-- Genre head -->
  <line x1="380" y1="741" x2="560" y2="530" stroke="#222222" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="560" y="506" width="150" height="46" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="635" y="534" font-size="14" fill="#111111" text-anchor="middle">Feed forward</text>

  <!-- Language head -->
  <line x1="380" y1="741" x2="560" y2="590" stroke="#222222" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="560" y="566" width="150" height="46" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="635" y="594" font-size="14" fill="#111111" text-anchor="middle">Feed forward</text>

  <!-- Provenience head: CLS + image feature -->
  <line x1="380" y1="741" x2="560" y2="660" stroke="#222222" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="380" y1="910" x2="560" y2="680" stroke="#0a6e6e" stroke-width="1.6" marker-end="url(#arrowRed)"/>
  <rect x="560" y="636" width="150" height="46" rx="6" fill="#ffffff" stroke="#b3005c" stroke-width="2"/>
  <text x="635" y="664" font-size="14" fill="#111111" text-anchor="middle">Feed forward</text>
  <text x="635" y="700" font-size="13" fill="#0a6e6e" text-anchor="middle" font-style="italic">[CLS] + image</text>

  <!-- ============ Output boxes ============ -->
  <!-- Restoration -->
  <line x1="710" y1="409" x2="900" y2="409" stroke="#222222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="900" y="392" font-size="17" fill="#111111">Restoration</text>
  <rect x="900" y="400" width="430" height="36" rx="4" fill="#ffffff" stroke="#b3005c" stroke-width="1.5"/>
  <text x="915" y="423" font-size="13" fill="#111111" font-family="Georgia, 'Times New Roman', serif">um-ma i-din-{d}suen-ma ... [x] e taš-hu [x] im-mar ...</text>

  <!-- Period -->
  <line x1="710" y1="469" x2="900" y2="469" stroke="#222222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="900" y="465" font-size="17" fill="#111111">Period</text>
  <rect x="1030" y="452" width="200" height="30" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.3"/>
  <text x="1040" y="473" font-size="13" fill="#111111">Old Babylonian (0.94)</text>

  <!-- Genre -->
  <line x1="710" y1="529" x2="900" y2="529" stroke="#222222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="900" y="525" font-size="17" fill="#111111">Genre</text>
  <rect x="1030" y="512" width="200" height="30" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.3"/>
  <text x="1040" y="533" font-size="13" fill="#111111">Letters (0.97)</text>

  <!-- Language -->
  <line x1="710" y1="589" x2="900" y2="589" stroke="#222222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="900" y="585" font-size="17" fill="#111111">Language</text>
  <rect x="1030" y="572" width="200" height="30" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.3"/>
  <text x="1040" y="593" font-size="13" fill="#111111">Akkadian (0.96)</text>

  <!-- Provenience -->
  <line x1="710" y1="659" x2="900" y2="659" stroke="#222222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="900" y="655" font-size="17" fill="#111111">Provenience</text>
  <rect x="1030" y="642" width="200" height="30" rx="4" fill="#ffffff" stroke="#b3005c" stroke-width="1.7"/>
  <text x="1040" y="663" font-size="13" fill="#111111">Sippar (0.82)</text>
  <g transform="translate(1240,637)">
    <rect x="0" y="0" width="24" height="30" rx="2" fill="#e9e2d3" stroke="#8a7a55" stroke-width="1.2"/>
    <path d="M3,24 L9,15 L14,20 L18,11 L21,24 Z" fill="#c9bb96"/>
  </g>
  <text x="1270" y="663" font-size="12" fill="#0a6e6e" font-style="italic">only head that sees the image</text>

  <!-- ============ Legend ============ -->
  <g transform="translate(900,760)">
    <rect x="0" y="0" width="460" height="150" rx="6" fill="#fbfbfb" stroke="#cccccc" stroke-width="1"/>
    <text x="16" y="24" font-size="14" fill="#111111" font-weight="bold">Legend</text>
    <rect x="16" y="36" width="20" height="14" fill="none" stroke="#b3005c" stroke-width="1.5"/>
    <text x="44" y="48" font-size="13" fill="#111111">Transformer-internal block / trained jointly, image-conditioned head</text>
    <rect x="16" y="60" width="20" height="14" fill="none" stroke="#0a6e6e" stroke-width="1.5"/>
    <text x="44" y="72" font-size="13" fill="#111111">Vision branch (ResNet18)</text>
    <line x1="16" y1="92" x2="36" y2="92" stroke="#222222" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="44" y="96" font-size="13" fill="#111111">Text path</text>
    <line x1="16" y1="112" x2="36" y2="112" stroke="#0a6e6e" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="44" y="116" font-size="13" fill="#111111">Image path (only 11.7% of tablets have one)</text>
    <text x="16" y="138" font-size="12" fill="#666666" font-style="italic">MLM/restoration head reads the full sequence; all four</text>
    <text x="16" y="150" font-size="12" fill="#666666" font-style="italic">metadata heads read [CLS] only; provenience also gets the image.</text>
  </g>
</svg>
